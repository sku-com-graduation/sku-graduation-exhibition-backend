plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ghostHoliday'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// Spring Boot 가 관리하는 버전 중 취약점이 남은 것만 덮어쓴다.
// 이 세 가지는 AWS SDK 가 이미 더 높은 버전을 요청하는데, dependency-management 플러그인이
// Spring Boot BOM 값으로 끌어내려 취약한 버전이 선택되고 있었다.
// 셋 다 이 서비스에서는 AWS SDK 경로로만 쓰인다(웹 계층은 Tomcat).
ext['netty.version'] = '4.1.137.Final'        // GHSA netty-codec / -http / -http2, 4.1.136 이상 필요
ext['httpclient5.version'] = '5.6.4'          // AWS SDK apache5-client 가 요청하는 버전
ext['httpcore5.version'] = '5.4.3'            // httpcore5 / -h2, 5.4.3 이상 필요

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'   // 버전 통일
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'      // 버전 통일
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'   // 버전 통일


	// OpenCSV 의존성 추가
	implementation 'com.opencsv:opencsv:5.12.0'

	implementation platform('software.amazon.awssdk:bom:2.54.2')
	implementation 'software.amazon.awssdk:s3'

	implementation 'net.bytebuddy:byte-buddy-agent:1.14.4'

	implementation("software.amazon.awssdk:cloudfront")
	implementation("software.amazon.awssdk:auth")


}

tasks.named('test') {
	useJUnitPlatform()
	// 테스트 출력의 한글이 깨지지 않도록 표준 출력 인코딩을 고정한다.
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed', 'skipped'
	}
}
