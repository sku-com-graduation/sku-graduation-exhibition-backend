name: Java CI/CD with Gradle

on:
  push:
    branches:
      - develop/main     # 기존 develop → develop/main 으로 변경
      - main             # 운영 배포 브랜치
  pull_request:
    branches:
      - develop/main     # PR 생성 시 빌드만 실행


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔐 Decode and save application-build.yml
        run: |
          echo "${{ secrets.APPLICATION_YML }}" | base64 -d > src/main/resources/application-build.yml

      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ✅ Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: 🏗️ Build Spring Boot project
        run: ./gradlew build --exclude-task test

      - name: ⬆️ Upload .jar file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicdsample
          path: build/libs/*.jar

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'   # main 브랜치 푸시 시에만 배포
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cicdsample

      - name: 🔐 Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.MY_PEM_KEY }}

      - name: ✅ Add EC2 to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 📤 SCP transfer to EC2
        run: scp -o StrictHostKeyChecking=no *-SNAPSHOT.jar ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/linuxMaster

      - name: 🚀 Run app on EC2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            sudo fuser -k 8081/tcp || true
            cd /home/ubuntu/linuxMaster
            nohup java -jar *-SNAPSHOT.jar --spring.profiles.active=build > nohup.out 2>&1 &"

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
